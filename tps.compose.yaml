# TPS bot protection service. See docs/install/bot-protection.md for details
# on enabling bot protection for ONI.
services:
  tps:
    build:
      context: ./docker/tps
    networks:
      default:
        aliases:
          # Generic name for Caddy to proxy to, shared by all bot-protection
          # services so the caddy-conf snippets don't care which one is in use
          - challenger
    environment:
      TURNSTILE_SITE_KEY: ${TPS_SITE_KEY:?set TPS_SITE_KEY in .env to use TPS}
      TURNSTILE_SECRET_KEY: ${TPS_SECRET_KEY:?set TPS_SECRET_KEY in .env to use TPS}
      JWT_SIGNING_KEY: ${TPS_JWT_KEY:?set TPS_JWT_KEY in .env to use TPS}
      TOKEN_LIFETIME: ${TPS_TOKEN_LIFETIME:-24h}
      TOKEN_REQUEST_BUDGET: ${TPS_TOKEN_REQUEST_BUDGET:-5000}
      TOKEN_IP_SWITCH_COST: ${TPS_TOKEN_IP_SWITCH_COST:-50}
    depends_on:
      app:
        condition: service_started
      web:
        condition: service_started
